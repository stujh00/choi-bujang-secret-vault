name: Stage 10 verified recovery checks

on:
  push:
    branches: [main]
    paths:
      - 'src/decider.mjs'
      - 'src/attack-check.mjs'
      - 'scripts/decider-test.mjs'
      - 'scripts/build-public.mjs'
      - 'scripts/deployment-identity.mjs'
      - 'aleph.config.json'
      - 'test/r5.test.mjs'
      - 'test/package-starter.test.mjs'
      - 'test/decider-stage7.test.mjs'
      - 'test/zone-stage8.test.mjs'
      - 'test/detect-stage9.test.mjs'
      - 'test/restore-stage10.test.mjs'
      - 'test/restore-env-stage10.test.mjs'
      - 'src/restore-env.mjs'
      - 'src/restore-backup.mjs'
      - 'backups/step10/safe-policy.json'
      - 'backups/step10/safe-policy.sha256'
      - 'scripts/restore-policy.mjs'
      - 'api/notes/audit.js'
      - 'api/operations.js'
      - 'api/restore/notes/[id].js'
      - 'api/notes/restore/[id].js'
      - 'src/restore-note.mjs'
      - 'api/restore.js'
      - 'supabase/stage10-verified-backup.sql'
      - 'src/detect.mjs'
      - 'docs/DETECT_EVENTS.md'
      - 'scripts/detect-test.mjs'
      - 'src/resource-zones.mjs'
      - 'src/announcement-api.mjs'
      - 'api/notes.js'
      - 'api/notes/[id].js'
      - 'api/announcements.js'
      - 'api/announcements/[id].js'
      - 'package.json'
      - '.github/workflows/stage6-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install exact dependencies
        run: npm ci
      - name: Run registered / unregistered device decision tests
        run: npm run decider:test
      - name: Run stage 7 synthetic access scenario
        run: npm run fixture:7
      - name: Test stage 9 synthetic burst detection
        run: npm run detect:test
      - name: Run existing project regression tests
        run: npm run test
      - name: Validate stage 10 restore authentication and failure handling
        run: node --test test/restore-stage10.test.mjs
      - name: Check isolated environment backup restore tests
        run: node --test test/restore-env-stage10.test.mjs
      - name: Independently verify reviewed safe policy snapshot
        run: npm run restore:plan
      - name: Build static files without deployment
        run: npm run build -- --local
      - name: Probe public deployment restore route without credentials
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.error
          host = "https://choi-bujang-secret-vault-six-zeta.vercel.app"
          checks = [
            ("identity", "/aleph.json", "GET", None),
            ("restore_method", "/api/restore", "GET", None),
            ("restore_unauthorized", "/api/restore", "POST", b"{}"),
            ("notes_unauthorized", "/api/notes", "GET", None),
          ]
          for name, path, method, payload in checks:
            try:
              request = urllib.request.Request(host + path, data=payload, method=method,
                headers={"Content-Type":"application/json","User-Agent":"student-safe-smoke-check"})
              with urllib.request.urlopen(request, timeout=12) as response:
                status = response.status
            except urllib.error.HTTPError as exc:
              status = exc.code
            except Exception as exc:
              status = "NETWORK_ERROR_" + type(exc).__name__
            print(name + ": " + str(status))
          PY
      - name: Prepare ignored submission explanation (not committed)
        run: |
          node -e 'require("node:fs").writeFileSync("bundle-notes.json", JSON.stringify({explanation:"10단계 격리 심판 대응: 백업은 RESTORE_NOTE_BACKUP_JSON 및 RESTORE_NOTE_BACKUP_SHA256에서만 읽고 SHA-256 이중 검증합니다. 단건 복구만 허용하며 복구 후 본인 조회와 타인 조회 거부를 다시 검증합니다. 운영 변조/삭제 실측은 심판 실행 전까지 미실행입니다.", blockedAt:null}, null, 2) + "\n")'
      - name: Create ignored submission bundle from this checked-out commit
        run: npm run bundle
      - name: Archive sanitized submission metadata
        uses: actions/upload-artifact@v4
        with:
          name: stage10-submission
          path: artifacts/submission.json
          retention-days: 7
      - name: Summarize without printing private responses
        if: always()
        run: git status --short
