name: Stage 8 resource boundary checks

on:
  push:
    branches: [main]
    paths:
      - 'src/decider.mjs'
      - 'src/attack-check.mjs'
      - 'scripts/decider-test.mjs'
      - 'scripts/build-public.mjs'
      - 'scripts/deployment-identity.mjs'
      - 'aleph.config.json'
      - 'test/r5.test.mjs'
      - 'test/decider-stage7.test.mjs'
      - 'test/zone-stage8.test.mjs'
      - 'src/resource-zones.mjs'
      - 'src/announcement-api.mjs'
      - 'api/notes.js'
      - 'api/notes/[id].js'
      - 'api/announcements.js'
      - 'api/announcements/[id].js'
      - 'package.json'
      - '.github/workflows/stage6-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install exact dependencies
        run: npm ci
      - name: Run registered / unregistered device decision tests
        run: npm run decider:test
      - name: Run stage 7 synthetic access scenario
        run: npm run fixture:7
      - name: Run existing project regression tests
        run: npm run test
      - name: Build static files without deployment
        run: npm run build -- --local
      - name: Prepare ignored submission explanation (not committed)
        run: |
          node -e 'require("node:fs").writeFileSync("bundle-notes.json", JSON.stringify({explanation:"8단계: 메모 UUID와 공지 UUID를 구별하고 검증된 사용자 ID에 묶인 owner_id로 메모를 필터링합니다. 공지 변경은 Supabase Auth 관리자 메타데이터의 강사 권한을 확인합니다. 판정기에는 소유자 정보가 없으므로 수정은 기본 거부하며, 운영 DB 교차 계정 시험은 미실행입니다.", blockedAt:null}, null, 2) + "\n")'
      - name: Create ignored submission bundle from this checked-out commit
        run: npm run bundle
      - name: Archive sanitized submission metadata
        uses: actions/upload-artifact@v4
        with:
          name: stage8-submission
          path: artifacts/submission.json
          retention-days: 7
      - name: Summarize without printing private responses
        if: always()
        run: git status --short
