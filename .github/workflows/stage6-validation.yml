name: Stage 9 verified-event detector checks

on:
  push:
    branches: [main]
    paths:
      - 'src/decider.mjs'
      - 'src/attack-check.mjs'
      - 'scripts/decider-test.mjs'
      - 'scripts/build-public.mjs'
      - 'scripts/deployment-identity.mjs'
      - 'aleph.config.json'
      - 'test/r5.test.mjs'
      - 'test/decider-stage7.test.mjs'
      - 'test/zone-stage8.test.mjs'
      - 'test/detect-stage9.test.mjs'
      - 'src/detect.mjs'
      - 'docs/DETECT_EVENTS.md'
      - 'scripts/detect-test.mjs'
      - 'src/resource-zones.mjs'
      - 'src/announcement-api.mjs'
      - 'api/notes.js'
      - 'api/notes/[id].js'
      - 'api/announcements.js'
      - 'api/announcements/[id].js'
      - 'package.json'
      - '.github/workflows/stage6-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install exact dependencies
        run: npm ci
      - name: Run registered / unregistered device decision tests
        run: npm run decider:test
      - name: Run stage 7 synthetic access scenario
        run: npm run fixture:7
      - name: Test stage 9 synthetic burst detection
        run: npm run detect:test
      - name: Run existing project regression tests
        run: npm run test
      - name: Build static files without deployment
        run: npm run build -- --local
      - name: Prepare ignored submission explanation (not committed)
        run: |
          node -e 'require("node:fs").writeFileSync("bundle-notes.json", JSON.stringify({explanation:"9단계: docs/DETECT_EVENTS.md 계약에 따라 같은 가명 주체의 10분 내 GET 121건 이상에서만 burst_read 신원 회수 제안을 반환합니다. 정상 기기와 다른 주체의 사건은 합산하지 않으며, 기기 ID나 네트워크 정보가 없어 실제 기기·세션 회수와 시간 측정은 심판 엔진에서만 가능합니다.", blockedAt:null}, null, 2) + "\n")'
      - name: Create ignored submission bundle from this checked-out commit
        run: npm run bundle
      - name: Archive sanitized submission metadata
        uses: actions/upload-artifact@v4
        with:
          name: stage9-submission
          path: artifacts/submission.json
          retention-days: 7
      - name: Summarize without printing private responses
        if: always()
        run: git status --short
